name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Compile
        run: make compile

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Start compose stack
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Run integration tests
        run: RUN_INTEGRATION=1 python -m pytest tests/integration

      - name: Stop compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
